.lgHead img{width:52px;height:52px;background:#fff;border-radius:8px;padding:3px}
.lgHead b{font-size:22px;font-weight:800;letter-spacing:.05em;color:var(--brand)}.lgHead b span{color:inherit}
.lgHead small{display:block;color:var(--muted);font-size:12px}
.lgCard .fld input{padding:8px 10px;font-size:14px}
.lgMsg{min-height:1.2em;color:var(--ng);font-size:13px;margin:0}
.who{font-size:12px;color:var(--muted);margin:0 6px}
#who{display:flex;align-items:center}
[hidden]{display:none!important}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:40px;height:40px;object-fit:contain;flex:none;background:#fff;border-radius:6px;padding:2px}
.logo .wm{display:flex;flex-direction:column;line-height:1.1}
.logo .wm b{font-size:18px;font-weight:800;letter-spacing:.05em;color:var(--brand)}
.logo .wm b span{color:inherit}
.logo .wm small{font-size:11.5px;color:var(--muted)}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header .brand{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
header .brand small{font-weight:500;color:var(--muted);margin-left:6px}
header input.pname{border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:180px;background:var(--soft)}
header .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.sm{padding:2px 7px;font-size:12px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
nav.tabs{display:flex;gap:2px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;background:none;padding:9px 12px;border-bottom:3px solid transparent;cursor:pointer;color:var(--muted);white-space:nowrap}
nav.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,1fr);gap:0;height:calc(100% - 96px);min-height:520px}
main.full{grid-template-columns:minmax(0,1fr)}
main.full #cadWrap{display:none}
main.full{height:auto}
main.full #panel{overflow:visible}
#cadWrap{position:relative;background:var(--cad);display:flex;flex-direction:column;min-height:420px}
#tools{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:#263033;border-bottom:1px solid #334044}
#tools button{background:#303B3F;color:#D7E2E0;border:1px solid #3E4C50;border-radius:5px;padding:4px 8px;cursor:pointer;font-size:12.5px}
#tools button.on{background:#0F5C8C;border-color:#3FA9F5;color:#fff}
#tools label{color:#AFC0BD;font-size:12px;display:flex;align-items:center;gap:4px}
#tools input{width:52px;background:#1E2427;border:1px solid #3E4C50;color:#E0EAE8;border-radius:4px;padding:2px 4px;font-size:12px}
#tools .sep{width:1px;background:#3E4C50;margin:0 4px}
#cv{flex:1;width:100%;display:block;cursor:crosshair;touch-action:none;user-select:none}
#cmd{display:flex;gap:8px;align-items:center;padding:5px 8px;background:#263033;color:#AFC0BD;font-size:12.5px;border-top:1px solid #334044}
#cmd input{flex:1;background:#1E2427;border:1px solid #3E4C50;color:#E0EAE8;border-radius:4px;padding:3px 6px}
#cmd .xy{min-width:150px;color:#E8E0A8;white-space:nowrap}
#hint{flex:0 1 auto;max-width:48%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cmd input{min-width:220px}
#panel{overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:14px 16px 40px}
main.full #panel{border-left:0;max-width:1180px;margin:0 auto;width:100%}
h2{font-size:17px;margin:4px 0 10px;letter-spacing:-.01em}
h3{font-size:14.5px;margin:18px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
h3:first-of-type{border-top:0;padding-top:0}
p.note{color:var(--muted);font-size:12.5px;margin:4px 0 8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 12px}
.fld{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--muted)}
.fld input,.fld select{border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:var(--soft);color:var(--ink);min-width:0}
.chk{display:flex;align-items:center;gap:6px;font-size:13px}
table.t{border-collapse:collapse;width:100%;font-size:12.5px;margin:4px 0}
table.t th{background:var(--soft);font-weight:600;text-align:left;padding:4px 5px;border-bottom:1px solid var(--line);position:sticky;top:0}
table.t td{padding:2px 5px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td input,table.t td select{width:100%;border:1px solid transparent;background:transparent;padding:2px 3px;border-radius:4px;min-width:44px}
table.t td input:hover,table.t td input:focus{border-color:var(--line);background:var(--soft)}
table.t tr.sel td{background:var(--accent-2)}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--soft)}
.num{text-align:right}
.tw{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-weight:600;font-size:12px}
.ok{color:var(--ok);background:var(--ok-bg)} .ng{color:var(--ng);background:var(--ng-bg)} .wr{color:var(--warn);background:var(--warn-bg)}
.box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--soft)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13px}
.kv b{font-weight:500;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--soft);padding:6px;font-size:12.5px}
.big{font-size:22px;font-weight:700;letter-spacing:-.02em}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 10px}
.stat>div{min-width:120px}
.stat small{display:block;color:var(--muted);font-size:12px}
.sw{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.sw button{border:0;background:var(--panel);padding:5px 14px;cursor:pointer}
.sw button.on{background:var(--accent);color:#fff}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.on{opacity:1}
.chart svg{width:100%;height:auto;background:var(--panel);border:1px solid var(--line);border-radius:6px}
.rep{max-width:900px}
.rep table{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0 14px}
.rep th,.rep td{border:1px solid var(--line);padding:3px 6px}
.rep th{background:var(--soft)}
@media (max-width:900px){ main{grid-template-columns:1fr;height:auto} #cadWrap{height:60vh} #panel{border-left:0} }
@media print{ header,nav.tabs,#cadWrap,.noprint{display:none!important} main{display:block;height:auto} #panel{overflow:visible} }
@media (prefers-reduced-motion: reduce){ #toast{transition:none} }
</style>
</head>

<script>
/* ===== ENGINE START ===== */
const ENG = (() => {
  // ---------- geometry ----------
  const G = {};
  G.area = p => { let s = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += a[0] * b[1] - b[0] * a[1]; } return s / 2; };
  G.centroid = p => {
    const A = G.area(p); if (Math.abs(A) < 1e-12) { const n = p.length; return [p.reduce((s, q) => s + q[0], 0) / n, p.reduce((s, q) => s + q[1], 0) / n]; }
    let cx = 0, cy = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length], f = a[0] * b[1] - b[0] * a[1]; cx += (a[0] + b[0]) * f; cy += (a[1] + b[1]) * f; }
    return [cx / (6 * A), cy / (6 * A)];
  };
  G.ccw = p => (G.area(p) < 0 ? p.slice().reverse() : p.slice());
  G.inside = (pt, poly) => {
    let c = false; const [x, y] = pt;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i], [xj, yj] = poly[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
    }
    return c;
  };

ACT.cPts = b => { const c = S.cols[+b.dataset.i]; const p = parsePts($('#cPts').value); if (p.length >= 3) { c.pts = p; changed(); } else toast('Cần ít nhất 3 đỉnh'); };
ACT.quickCap = () => { const bx = +$('#qBx').value, by = +$('#qBy').value, h = +$('#qH').value; S.zones.unshift({ id: uid(), name: 'Đài chính', pts: G.rect(0, 0, bx, by).map(p => p.map(r3)), h, top: 0, pit: false }); changed(); fit(); draw(); };
ACT.addPile = () => { S.piles.push({ id: nextPileId(), x: 0, y: 0 }); changed(); };
ACT.delPile = b => { S.piles.splice(+b.dataset.i, 1); changed(); };
ACT.delCol = b => { S.cols.splice(+b.dataset.i, 1); changed(); };
ACT.renum = () => { S.piles.sort((a, b) => (b.y - a.y) || (a.x - b.x)).forEach((p, i) => p.id = 'P' + (i + 1)); changed(); };
ACT.clearPiles = () => { S.piles = []; changed(); };
ACT.grid = b => { const nx = +$('#gNx').value, ny = +$('#gNy').value, sx = +$('#gSx').value, sy = +$('#gSy').value, x0 = +$('#gX0').value, y0 = +$('#gY0').value; if (b.dataset.rep) S.piles = []; for (let j = ny - 1; j >= 0; j--) for (let i = 0; i < nx; i++) S.piles.push({ id: nextPileId(), x: r3(x0 + (i - (nx - 1) / 2) * sx), y: r3(y0 + (j - (ny - 1) / 2) * sy) }); changed(); fit(); draw(); };
ACT.pastePiles = () => { const rows = $('#pastePiles').value.trim().split(/\n+/).map(l => l.trim().split(/[\t,;\s]+/)).filter(r => r.length >= 2); const out = []; rows.forEach((r, i) => { const nums = r.map(Number); if (r.length >= 3 && isNaN(nums[0])) out.push({ id: r[0], x: +r[1], y: +r[2] }); else if (!isNaN(nums[0]) && !isNaN(nums[1])) out.push({ id: 'P' + (i + 1), x: nums[0], y: nums[1] }); }); if (!out.length) { toast('Không đọc được tọa độ'); return; } S.piles = out; changed(); fit(); draw(); };
function parsePts(t) { return t.trim().split(/\n+/).map(l => l.split(/[,;\s\t]+/).map(Number)).filter(p => p.length >= 2 && !isNaN(p[0]) && !isNaN(p[1])).map(p => [p[0], p[1]]); }

    <p class="note">γb1 = 1,0 tải ngắn hạn; 0,9 tải dài hạn (6.1.2.3). Mô men: 8.1.6.1 cho phép kể một nửa Mloc (mô men tại nút cột–bản sàn, nửa kia do tiết diện thẳng góc của bản chịu). Với đài cọc, mô men chân cột truyền trọn vào đài → mặc định kể toàn bộ.</p>`}

ACT.std = b => { S.std = b.dataset.v; changed(); };
DERIVED.mat = () => {
  const z = mainZone(); if (!z) return '<p class="note">Chưa có đài.</p>';
  const hmm = z.h * 1000, d = hmm - S.rb.cover - 0.75 * S.rb.botX.dia - 0.25 * S.rb.botY.dia, rows = [];
  const add = (a, b, c, ok) => rows.push(`<tr><td>${a}</td><td>${b}</td><td>${c}</td><td><span class="tag ${ok ? 'ok' : 'ng'}">${ok ? 'Đạt' : 'Không đạt'}</span></td></tr>`);
  const m = mat();
  if (S.std === 'EC2') {
    const rmin = Math.max(0.26 * m.fctm / S.ec2.fyk, 0.0013);
    ['botX', 'botY', 'topX', 'topY'].forEach(k => { const r = asPerM(S.rb[k]) / (1000 * d); add(`ρ ${k}`, `${fx(r * 100, 3)}%`, `≥ ${fx(rmin * 100, 3)}% (9.2.1.1)`, r >= rmin); });
    ['botX', 'botY'].forEach(k => add(`Bước ${k}`, `${S.rb[k].s} mm`, `≤ ${Math.min(3 * hmm, 400)} mm (9.3.1.1)`, S.rb[k].s <= Math.min(3 * hmm, 400)));
    add('Φ thép chịu kéo', `${Math.min(S.rb.botX.dia, S.rb.botY.dia)} mm`, '≥ 8 mm (9.8.1(3))', Math.min(S.rb.botX.dia, S.rb.botY.dia) >= 8);
    if (S.rb.links.on) {
      const L = S.rb.links, A1 = Math.PI * L.dia * L.dia / 4, amin = 0.08 * Math.sqrt(m.fck) / S.ec2.fywk * L.sx * L.sy / 1.5;
      add('Bước đai hướng tâm sr', `${Math.max(L.sx, L.sy)} mm`, `≤ 0,75d = ${fx(0.75 * d, 0)} mm (9.4.3(1))`, Math.max(L.sx, L.sy) <= 0.75 * d);
      add('Bước đai tiếp tuyến st', `${Math.min(L.sx, L.sy)} mm`, `≤ 1,5d = ${fx(1.5 * d, 0)} mm`, Math.min(L.sx, L.sy) <= 1.5 * d);
      add('Diện tích 1 nhánh', `${fx(A1, 1)} mm²`, `≥ ${fx(amin, 1)} mm² (9.11)`, A1 >= amin);
      add('Vùng đặt cốt thép từ mép cột', `${fx(L.extK, 2)}d`, 'u_out tính tại vùng + 1,5d (6.4.5(4)); hàng đầu ≤ 0,5d (9.4.3)', L.extK >= 0.5);
    }
  } else {
    ['botX', 'botY', 'topX', 'topY'].forEach(k => { const r = asPerM(S.rb[k]) / (1000 * d); add(`μ ${k}`, `${fx(r * 100, 3)}%`, '≥ 0,1% (10.3.3.1)', r >= 0.001); });
    ['botX', 'botY'].forEach(k => add(`Bước ${k}`, `${S.rb[k].s} mm`, `≤ min(1,5h; 400) = ${Math.min(1.5 * hmm, 400)} mm (10.3.3.3)`, S.rb[k].s <= Math.min(1.5 * hmm, 400)));
    if (S.rb.links.on) { add('Chiều rộng vùng đặt cốt thép ngang', `${fx(S.rb.links.extK, 2)}h₀`, '≥ 1,5h₀ tính từ mép diện truyền tải (10.3.4.7)', S.rb.links.extK >= 1.5); add('Hàng cốt thép ngang đầu tiên', 'h₀/3 (app bố trí)', 'cách mép tải h₀/3 ÷ h₀/2', true);
    const L = S.rb.links, lim = Math.min(d / 3, 300); add('Bước cốt thép ngang vùng chọc thủng', `${Math.max(L.sx, L.sy)} mm`, `≤ min(h₀/3; 300) = ${fx(lim, 0)} mm (10.3.4.7)`, Math.max(L.sx, L.sy) <= lim); }
  }
  return `<p class="note">h = ${fx(hmm, 0)} mm, d (h₀) trung bình = ${fx(d, 0)} mm</p><table class="t"><tr><th>Hạng mục</th><th>Giá trị</th><th>Yêu cầu</th><th></th></tr>${rows.join('')}</table>`;
};

// ================= PUNCHING =================
function distPoly(pt, P) { let m = 1e9; for (let i = 0; i < P.length; i++) { const a = P[i], b = P[(i + 1) % P.length], dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy || 1e-12; let t = ((pt[0] - a[0]) * dx + (pt[1] - a[1]) * dy) / L2; t = Math.max(0, Math.min(1, t)); m = Math.min(m, Math.hypot(pt[0] - a[0] - t * dx, pt[1] - a[1] - t * dy)); } return m; }
function runPunch() {
  const zs = engZones(); if (!zs.length) return { err: 'Chưa có đài.' };
  const cap = ENG.capModel(zs, engRb()), m = mat(), out = [];
  const ulsC = combos('ULS'); if (!ulsC.length) return { err: 'Chưa có tổ hợp ULS.' };
  const asx = asPerM(S.rb.botX), asy = asPerM(S.rb.botY);
  const rhoFn = d => Math.min(Math.sqrt(asx * asy) / (1000 * d), 0.02);
  // TLBT đài + đất đắp không gây chọc thủng (bài báo Lê Minh Long 2019, mục 2.1): phản lực dùng cho cột lấy KHÔNG kể TLBT; chỉ tải mặt đài q nằm trong tháp được cộng lại
  const wAt = pt => qAt(pt, 'ULS');
  const L = S.rb.links, Aleg = Math.PI * L.dia * L.dia / 4, skipped = {};
  for (const c of ulsC) {
    const r = reactions(c, true), rFull = reactions(c), rows = S.loads.filter(l => l.combo === c);
    // column loads
    for (const col of S.cols) {
      const P = colPoly(col); if (P.length < 3) continue; const cc = G.centroid(G.ccw(P));
      let N = 0, Mx = 0, My = 0;
      rows.forEach(l => { if (colOfLoad(l) === col) { N += +l.N; Mx += +l.Mx + (+l.N) * (l.y - cc[1]); My += +l.My + (+l.N) * (l.x - cc[0]); } });
      if (N <= 0) continue;
      const base = { obj: col.name, kind: 'col', combo: c, std: S.std };
      if (S.std === 'EC2') {
        const res = ENG.ec2Punch(P, N, { Mx, My }, { cap, fck: m.fck, gc: S.ec2.gc, rhoFn, kmax: S.ec2.kmax, piles: S.piles, R: r.R, pileShape: S.pile.shape, pileD: S.pile.D, wArea: wAt(cc), reduce: S.opt.reduce, enhance: S.opt.enhance, links: { on: L.on, rhoW: Aleg / (L.sx * L.sy), fywd: m.fywd, extK: L.extK } });
        const pilesIn = res.crit ? S.piles.map((p, j) => G.inside([p.x, p.y], res.crit.poly) ? j : -1).filter(j => j >= 0) : [];
        out.push({ ...base, N, Mx, My, res, ratio: res.ratio, hull: res.hull, crit: res.crit, pilesIn });
      } else {
        const cm = S.opt.colMode || 'both';
        const res = ENG.tcvnPunch(P, N, { Mx, My }, { cap, Rbt: m.Rbt, Rsw: m.Rsw, gb1: S.tcvn.gb1, piles: S.piles, R: r.R, reduce: S.opt.reduce, wArea: wAt(cc), links: { on: L.on, Aleg, sx: L.sx, sy: L.sy, extK: L.extK }, mFactor: S.tcvn.mFactor });
        if (cm !== 'pyr') out.push({ ...base, N, Mx, My, res, ratio: res.ratio, hull: res.hull, crit: res.crit, pilesIn: res.pilesIn });
        if (cm !== 'std') { const py = ENG.capPyramid(G.hull(P), N, { cap, piles: S.piles, R: r.R, pileD: S.pile.D, Rbt: m.Rbt, gb1: S.tcvn.gb1, variant: S.opt.pyrVar, qA: wAt(cc) });
          if (py.anyInside || cm === 'pyr') out.push({ ...base, obj: col.name + ' – tháp tới mép trong cọc', kind: 'pyr', N, res: py, ratio: py.ratio, hull: G.hull(P), crit: { poly: py.base }, pilesIn: py.inIdx }); }
      }
    }
    // cắt một phương tại 4 mép cột/lõi
    if (S.opt.oneWay) for (const col of S.cols) {
      const P = colPoly(col); if (P.length < 3) continue; const hull = G.hull(P);
      for (const dir of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const ow = ENG.oneWay(hull, dir, { cap, piles: S.piles, R: r.R, pileD: S.pile.D, std: S.std, fck: m.fck, gc: S.ec2.gc, rhoFn, Rbt: m.Rbt, Rb: m.Rb, gb1: S.tcvn.gb1, Rsw: m.Rsw, links: { on: L.on, Aleg, sx: L.sx, sy: L.sy } });
        if (!ow || !ow.rows.length) continue;
        const nm = `${col.name} – cắt 1 phương ${dir[0] ? (dir[0] > 0 ? '+X' : '−X') : (dir[1] > 0 ? '+Y' : '−Y')}`;
        const line = dir[0] ? [[ow.face, -1e3], [ow.face, 1e3]] : [[-1e3, ow.face], [1e3, ow.face]];
        out.push({ obj: nm, kind: 'shear', combo: c, std: S.std, N: S.std === 'EC2' ? ow.Vred : ow.Q, res: ow, ratio: ow.ratio, hull, line, pilesIn: S.piles.map((p, j) => ((dir[0] ? p.x : p.y) - ow.face) * (dir[0] || dir[1]) > -S.pile.D / 2 ? j : -1).filter(j => j >= 0) });
      }
    }
    // piles punching upward (phản lực đầy đủ, có TLBT)
    if (S.opt.pilePunch) S.piles.forEach((p, j) => {
      const R = rFull.R[j]; if (R <= 0) return;
      if (!cap.inCap([p.x, p.y])) return;
      const dl = cap.dAt([p.x, p.y]);
      const near = S.cols.find(col => { const hull = G.hull(colPoly(col)); if (G.inside([p.x, p.y], hull)) return true;
        return S.std === 'EC2' ? distPoly([p.x, p.y], hull) - S.pile.D / 2 < 2 * dl / 1000 : G.inside([p.x, p.y], G.offset(hull, dl / 1000, false)); });
      if (near) { skipped[p.id] = near.name; return; }
      const P = pilePoly(p), base = { obj: 'Cọc ' + p.id, kind: 'pile', combo: c, std: S.std, N: R, Mx: 0, My: 0 };
      if (S.std === 'EC2') {
        const res = ENG.ec2Punch(P, R, { Mx: 0, My: 0 }, { cap, fck: m.fck, gc: S.ec2.gc, rhoFn, kmax: S.ec2.kmax, piles: [], R: [], pileShape: S.pile.shape, pileD: S.pile.D, wArea: 0, reduce: false, enhance: S.opt.enhance, links: { on: L.on, rhoW: Aleg / (L.sx * L.sy), fywd: m.fywd, extK: L.extK } });
        out.push({ ...base, res, ratio: res.ratio, hull: res.hull, crit: res.crit, pilesIn: [j] });
      } else {
        const res = ENG.tcvnPunch(P, R, { Mx: 0, My: 0 }, { cap, Rbt: m.Rbt, Rsw: m.Rsw, gb1: S.tcvn.gb1, piles: [], R: [], reduce: false, wArea: 0, links: { on: L.on, Aleg, sx: L.sx, sy: L.sy, extK: L.extK }, mFactor: 0 });
        out.push({ ...base, res, ratio: res.ratio, hull: res.hull, crit: res.crit, pilesIn: [j] });
      }
    });
  }
  // envelope per object
  const env = {}; out.forEach(o => { if (!env[o.obj] || o.ratio > env[o.obj].ratio) env[o.obj] = o; });
  return { all: out, env: Object.values(env).sort((a, b) => b.ratio - a.ratio), skipped };
}

  const R = punchRes;
  const head = `<h2>Kiểm tra chọc thủng – ${S.std === 'EC2' ? 'EN 1992-1-1 §6.4' : 'TCVN 5574:2018 §8.1.6'}</h2>

  ${S.std === 'TCVN' ? `<div class="box"><div class="grid2">${selF('opt.colMode', 'Phương pháp kiểm tra chọc thủng cột/lõi', [['std', 'TCVN 5574:2018 – đường bao h₀/2 (8.1.6)'], ['pyr', 'Tháp tới mép trong cọc (đài cọc truyền thống)'], ['both', 'Cả hai – lấy bất lợi']])}
  ${(S.opt.colMode || 'both') !== 'std' ? selF('opt.pyrVar', 'Công thức tháp tới mép trong cọc', [['snip', 'SNiP 2.03.01-84: k = h₀/c'], ['vn', 'Giáo trình VN: α = 1,5√(1+(h₀/c)²)']]) : ''}</div>
  <p class="note">TCVN 5574:2018: đường bao cách mép cột h₀/2, trừ phản lực cọc có tâm trong đáy tháp 45°. Tháp tới mép trong cọc: không có trong TCVN 5574:2018, dùng cho đài dày khi cọc lọt vào tháp 45°; khi không có cọc trong tháp thì c = h₀ (với công thức SNiP trùng tháp 45°).</p></div>` : ''}

function soilLayers() { let top = +S.soil.zGround; return S.soil.layers.map(L => { const o = { ...L, top, bot: top - (+L.thk) }; top = o.bot; return o; }); }

  const cs = combos('SLS'); const combo = cs.includes(S.soil.combo) ? S.soil.combo : cs[0];

  const rows = S.loads.filter(l => l.combo === combo);
  const n = S.piles.length, xc = S.piles.reduce((s, p) => s + p.x, 0) / n, yc = S.piles.reduce((s, p) => s + p.y, 0) / n;
  const cw = capWeight(), al = areaLoadRes('SLS'); const Wc = S.soil.inclW ? cw.W : 0, Wadd = Wc + al.W;

  dxfData = null; changed(); fit(); draw(); toast(`Đã dựng ${S.zones.length} vùng đài, ${S.piles.length} cọc, ${S.cols.length} cột/lõi`);
};
function openDXF(file) { const rd = new FileReader(); rd.onload = () => { try { const d = parseDXF(rd.result); d.name = file.name; if (!d.ents.length) throw new Error('không có đối tượng'); dxfData = d; setTab('geo'); } catch (e) { toast('Không đọc được DXF: ' + e.message); } }; rd.readAsText(file); }

// ================= INIT =================
renderTabs(); renderTools(); $('#pname').value = S.name;
requestAnimationFrame(() => { fit(); draw(); renderPanel(); dirty = false; });
authInit();
window.__app = { get S() { return S; }, runPunch, runSettle, reactions, setTab };
})();

</script>
